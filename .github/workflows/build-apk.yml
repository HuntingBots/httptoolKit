name: Build Android APK (Android 14+ Ready)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug
      create_release:
        description: 'Create GitHub Release with APK assets'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'debug' }}
        run: |
          echo "Building Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK & AAB
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'release' }}
        run: |
          echo "Building Release APK and AAB..."
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign Release APK & Prepare Artifacts
        shell: bash
        env:
          ANDROID_SIGNING_JKS_BASE64: ${{ secrets.ANDROID_SIGNING_JKS_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p output

          # Prepare Debug APK if built
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/httptoolkit-clone-debug.apk
            echo "Copied httptoolkit-clone-debug.apk"
          fi

          # Sign and prepare Release APK if built
          UNSIGNED_APK=""
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          fi

          if [ -n "$UNSIGNED_APK" ]; then
            SIGNED_APK="output/httptoolkit-clone-release.apk"

            # Check if user provided signing secrets
            if [ -n "$ANDROID_SIGNING_JKS_BASE64" ]; then
              echo "Using custom signing keystore from GitHub Secrets..."
              echo "$ANDROID_SIGNING_JKS_BASE64" | base64 -d > release.keystore
              KEYSTORE_PATH="release.keystore"
              KEY_ALIAS="${SIGNING_KEY_ALIAS:-release}"
              STORE_PASS="${SIGNING_KEY_STORE_PASSWORD:-android}"
              KEY_PASS="${SIGNING_KEY_PASSWORD:-android}"
            else
              echo "Generating automated release signing key..."
              keytool -genkeypair -v -keystore release.keystore \
                -alias httptoolkit-release -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass androidpassword -keypass androidpassword \
                -dname "CN=HTTPToolkitClone, OU=Development, O=OpenSource, L=Global, S=Global, C=US"
              KEYSTORE_PATH="release.keystore"
              KEY_ALIAS="httptoolkit-release"
              STORE_PASS="androidpassword"
              KEY_PASS="androidpassword"
            fi

            # Locate latest apksigner & zipalign
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
            ZIPALIGN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name zipalign 2>/dev/null | sort -V | tail -n 1)

            rm -f aligned.apk
            echo "Aligning APK with $ZIPALIGN..."
            $ZIPALIGN -v -p 4 "$UNSIGNED_APK" aligned.apk

            echo "Signing APK with $APKSIGNER (V2, V3, V4 enabled for Android 14+)..."
            $APKSIGNER sign --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --out "$SIGNED_APK" aligned.apk

            echo "Verifying signed APK..."
            $APKSIGNER verify -v "$SIGNED_APK"
          fi

          # Prepare Release AAB if built
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab output/httptoolkit-clone-release.aab
          fi

          # Generate SHA256 checksums if any files exist in output
          if ls output/* 1> /dev/null 2>&1; then
            cd output
            sha256sum * 2>/dev/null > checksums.txt || true
            cat checksums.txt
            cd ..
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: httptoolkit-android14-builds
          path: output/
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || github.event.inputs.create_release == 'true')) || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/HuntingBots' || github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.7.0-build{0}', github.run_number) }}"
          name: "HTTP Toolkit Clone Android 14+ Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ### 🚀 HTTP Toolkit Clone for Android 14+ (24/7 Ready)
            
            This automated build is fully optimized and signed for **Android 14+ (API 34/35/37)**.
            
            #### 📦 Included Binaries:
            * `httptoolkit-clone-release.apk`: Production build, signed with V2/V3/V4 signatures.
            * `httptoolkit-clone-debug.apk`: Debug build with standard Android debug signature.
            * `httptoolkit-clone-release.aab`: Android App Bundle for deployment.
            * `checksums.txt`: SHA-256 verification hashes.
            
            #### 📱 Android 14+ Features:
            * Fully compatible with Android 14 & 15 Conscrypt APEX certificate store.
            * VPN interception with per-app and per-port routing.
            * Works seamlessly with Frida universal SSL unpinning scripts included in the repo.
            * Ready to connect to any 24/7 HTTP Toolkit / Frida proxy server.
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
